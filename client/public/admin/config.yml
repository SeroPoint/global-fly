backend:
  name: github
  repo: SeroPoint/global-fly
  branch: main
  # OAuth proxy for GitHub login. Replace with your deployed Cloudflare Worker URL.
  # See ADMIN_SETUP.md for setup instructions.
  base_url: https://REPLACE-WITH-YOUR-WORKER.workers.dev
  auth_endpoint: auth

# Fallback for local testing: run `npx decap-server` on port 8081 and uncomment:
# local_backend: true

publish_mode: simple

media_folder: "client/public/images"
public_folder: "/images"

site_url: https://rogerworldflight.com
display_url: https://rogerworldflight.com
logo_url: https://rogerworldflight.com/images/mainpics.png

locale: zh_Hant

collections:
  - name: content
    label: 網站內容
    editor:
      preview: false
    files:
      - file: "client/src/content/hero.json"
        label: Hero 首頁橫幅
        name: hero
        fields:
          - { name: title, label: 主標題, widget: string }
          - { name: subtitle, label: 副標題, widget: string }
          - { name: taglineZh, label: 中文標語, widget: string }
          - { name: taglineEn, label: 英文標語, widget: string }
          - { name: backgroundImage, label: 背景圖, widget: image }
          - name: stats
            label: 數據統計
            widget: list
            fields:
              - { name: value, label: 數值, widget: string }
              - { name: label, label: 說明, widget: string }

      - file: "client/src/content/about.json"
        label: 關於林睿哲
        name: about
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - name: identity
            label: 身份與角色
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - { name: items, label: 項目, widget: list, field: { name: item, label: 項目, widget: string } }
          - name: education
            label: 教育背景
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - { name: items, label: 項目, widget: list, field: { name: item, label: 項目, widget: string } }
          - name: qualification
            label: 飛行資格
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - { name: text, label: 內文, widget: text }
          - { name: quote, label: 引言, widget: text }

      - file: "client/src/content/route.json"
        label: 環球飛行路線
        name: route
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - { name: mapImage, label: 路線圖, widget: image }
          - name: aircraft
            label: 飛機詳情
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - name: items
                label: 項目
                widget: list
                fields:
                  - { name: label, label: 名稱, widget: string }
                  - { name: value, label: 數值, widget: string }
          - name: stats
            label: 飛行統計
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - name: items
                label: 項目
                widget: list
                fields:
                  - { name: label, label: 名稱, widget: string }
                  - { name: value, label: 數值, widget: string }
          - name: waypoints
            label: 主要航點
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - { name: lines, label: 航點行, widget: list, field: { name: line, label: 一行, widget: string } }
          - name: liveTracking
            label: 即時追蹤
            widget: object
            fields:
              - { name: title, label: 小標題, widget: string }
              - { name: iframeSrc, label: iframe 網址, widget: string }

      - file: "client/src/content/sponsors.json"
        label: 贊助商
        name: sponsors
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - name: items
            label: 贊助商列表
            widget: list
            fields:
              - { name: image, label: Logo 圖, widget: image }
              - { name: alt, label: 名稱 (alt), widget: string }
              - { name: whiteBg, label: 白色背景, widget: boolean, default: false }

      - file: "client/src/content/social.json"
        label: 社群實時動態
        name: social
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - name: facebook
            label: Facebook 卡片
            widget: object
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: subtitle, label: 副標題, widget: string }
              - { name: description, label: 描述, widget: text }
              - name: bullets
                label: 條列項目
                widget: list
                fields:
                  - { name: icon, label: Icon (emoji), widget: string }
                  - { name: title, label: 標題, widget: string }
                  - { name: text, label: 說明, widget: string }
              - { name: buttonText, label: 按鈕文字, widget: string }
              - { name: buttonUrl, label: 按鈕連結, widget: string }
          - name: threads
            label: Threads / Instagram 卡片
            widget: object
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: subtitle, label: 副標題, widget: string }
              - { name: description, label: 描述, widget: text }
              - name: bullets
                label: 條列項目
                widget: list
                fields:
                  - { name: icon, label: Icon (emoji), widget: string }
                  - { name: title, label: 標題, widget: string }
                  - { name: text, label: 說明, widget: string }
              - { name: threadsUrl, label: Threads 連結, widget: string }
              - { name: instagramUrl, label: Instagram 連結, widget: string }

      - file: "client/src/content/stories.json"
        label: 林睿哲的故事
        name: stories
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - name: items
            label: 故事列表
            widget: list
            fields:
              - { name: id, label: ID (唯一值), widget: string }
              - { name: title, label: 故事標題, widget: string }
              - { name: subtitle, label: 故事副標, widget: string }
              - { name: paragraphs, label: 段落 (選填), widget: list, required: false, field: { name: p, label: 段落, widget: text } }
              - name: intro
                label: 前言 (選填, 僅 story3)
                widget: object
                required: false
                fields:
                  - { name: heading, label: 小標題, widget: string, required: false }
                  - { name: text, label: 內文, widget: text, required: false }
              - { name: requirementsHeading, label: 條件區塊標題 (選填), widget: string, required: false }
              - name: requirements
                label: 條件列表 (選填, 僅 story3)
                widget: list
                required: false
                fields:
                  - { name: number, label: 編號, widget: string }
                  - { name: title, label: 標題, widget: string }
                  - { name: text, label: 內文, widget: text }
              - { name: highlight, label: 底部標語 (選填), widget: string, required: false }

      - file: "client/src/content/cta.json"
        label: 行動呼籲區塊
        name: cta
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - { name: subheading, label: 副標, widget: string }
          - { name: primaryButton, label: 主按鈕文字, widget: string }
          - { name: secondaryButton, label: 次按鈕文字, widget: string }
          - name: social
            label: 社群連結
            widget: object
            fields:
              - { name: facebook, label: Facebook URL, widget: string, required: false }
              - { name: instagram, label: Instagram URL, widget: string, required: false }
              - { name: youtube, label: YouTube URL (留空則不顯示), widget: string, required: false }

      - file: "client/src/content/linepay.json"
        label: Line Pay 贊助區
        name: linepay
        fields:
          - { name: heading, label: 區塊標題, widget: string }
          - { name: qrImage, label: QR Code 圖, widget: image }
          - { name: qrCaption, label: QR 下方說明, widget: string }
          - { name: title, label: 標題, widget: string }
          - { name: subtitle, label: 副標, widget: string }
          - { name: note, label: 備註, widget: string }
          - { name: stepsHeading, label: 步驟區塊標題, widget: string }
          - name: steps
            label: 贊助步驟
            widget: list
            fields:
              - { name: icon, label: Icon (emoji), widget: string }
              - { name: text, label: 說明, widget: string }
          - name: formButton
            label: 表單按鈕
            widget: object
            fields:
              - { name: text, label: 按鈕文字, widget: string }
              - { name: url, label: 連結, widget: string }
          - name: emailButton
            label: Email 按鈕
            widget: object
            fields:
              - { name: text, label: 按鈕文字, widget: string }
              - { name: url, label: 連結 (mailto:), widget: string }
          - { name: disclaimer, label: 免責聲明, widget: text }

      - file: "client/src/content/footer.json"
        label: Footer
        name: footer
        fields:
          - { name: copyright, label: 版權文字, widget: string }
          - { name: prefix, label: 前綴文字, widget: string }
          - name: links
            label: 連結列表
            widget: list
            fields:
              - { name: label, label: 顯示文字, widget: string }
              - { name: url, label: 連結, widget: string }

      - file: "client/src/content/nav.json"
        label: 導覽列
        name: nav
        fields:
          - { name: brand, label: 品牌名, widget: string }
          - name: links
            label: 連結
            widget: list
            fields:
              - { name: label, label: 顯示文字, widget: string }
              - { name: anchor, label: 錨點 (#id), widget: string }

name = "global-fly-cms-oauth"
main = "worker.js"
compatibility_date = "2025-01-01"

# 部署完成後，Cloudflare 會給你一個 URL，例如：
# https://global-fly-cms-oauth.<your-account>.workers.dev
#
# 將該 URL 填入 client/public/admin/config.yml 的 backend.base_url
#
# 另需在 Cloudflare dashboard 設定下列 Secrets (Settings → Variables → Secrets)：
#   OAUTH_CLIENT_ID      GitHub OAuth App Client ID
#   OAUTH_CLIENT_SECRET  GitHub OAuth App Client Secret
#   ALLOWED_ORIGIN       https://rogerworldflight.com,https://seropoint.github.io
